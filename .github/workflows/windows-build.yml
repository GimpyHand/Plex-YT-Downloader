name: Windows build

on:
  workflow_dispatch:
  push:
    branches:
      - "build/**"
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-pip
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-python-cairo
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-pyinstaller
            mingw-w64-ucrt-x86_64-ffmpeg
      - name: Install Python dependencies
        run: python -m pip install --upgrade yt-dlp
      - name: Build Windows app
        run: |
          runtime_prefix="$(cygpath -m /ucrt64)"
          runtime_bin="$runtime_prefix/bin"
          glib-compile-schemas /ucrt64/share/glib-2.0/schemas
          python -m PyInstaller --noconfirm --clean --onefile --console \
            --name yt-dlp --collect-all yt_dlp tools/yt_dlp_entry.py
          python -m PyInstaller --noconfirm --clean --onefile --windowed \
            --name MediaDL --collect-all gi --collect-all cairo \
            --collect-all yt_dlp --hidden-import gi.repository.Gtk \
            --hidden-import gi.repository.Adw \
            --add-binary "dist/yt-dlp.exe;." \
            --add-binary "$runtime_bin/libgtk-4-1.dll;." \
            --add-binary "$runtime_bin/libadwaita-1-0.dll;." \
            --add-binary "$runtime_bin/ffmpeg.exe;." \
            --add-binary "$runtime_bin/ffprobe.exe;." \
            --add-data "$runtime_prefix/lib/girepository-1.0;lib/girepository-1.0" \
            --add-data "$runtime_prefix/share/glib-2.0/schemas;share/glib-2.0/schemas" \
            --add-data "$runtime_prefix/share/icons/Adwaita;share/icons/Adwaita" \
            media_dl/__main__.py
      - name: Archive portable app
        shell: pwsh
        run: Compress-Archive -Path dist/MediaDL.exe -DestinationPath dist/MediaDL-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MediaDL-windows-x64
          path: dist/MediaDL-windows-x64.zip
