name: Windows build

on:
  workflow_dispatch:
  push:
    branches:
      - "build/**"
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-pip
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-python-cairo
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-pyinstaller
            mingw-w64-ucrt-x86_64-ffmpeg
      - name: Install Python dependencies
        run: python -m pip install --upgrade yt-dlp
      - name: Build Windows app
        run: |
          runtime_bin="$(cygpath -m /ucrt64/bin)"
          python -m PyInstaller --noconfirm --clean --windowed --onedir \
            --name MediaDL --collect-all gi --collect-all cairo \
            --collect-all yt_dlp --hidden-import gi.repository.Gtk \
            --hidden-import gi.repository.Adw \
            --add-binary "$runtime_bin/libgtk-4-1.dll;." \
            --add-binary "$runtime_bin/libadwaita-1-0.dll;." \
            --add-binary "$runtime_bin/ffmpeg.exe;." \
            --add-binary "$runtime_bin/ffprobe.exe;." media_dl/__main__.py
          python -m PyInstaller --noconfirm --clean --onefile --console \
            --name yt-dlp --collect-all yt_dlp tools/yt_dlp_entry.py
          cp dist/yt-dlp.exe dist/MediaDL/yt-dlp.exe
          mkdir -p dist/MediaDL/lib/girepository-1.0 dist/MediaDL/share/glib-2.0/schemas dist/MediaDL/share/icons
          cp -r /ucrt64/lib/girepository-1.0/. dist/MediaDL/lib/girepository-1.0/
          cp -r /ucrt64/share/glib-2.0/schemas/. dist/MediaDL/share/glib-2.0/schemas/
          glib-compile-schemas dist/MediaDL/share/glib-2.0/schemas
          cp -r /ucrt64/share/icons/Adwaita dist/MediaDL/share/icons/
      - name: Archive portable app
        shell: pwsh
        run: Compress-Archive -Path dist/MediaDL -DestinationPath dist/MediaDL-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MediaDL-windows-x64
          path: dist/MediaDL-windows-x64.zip
